<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="SimpleRPG — a fully single-player fantasy browser RPG. Missions, arena, dungeons, and a Hall of Fame that never noticed it isn't online."
    />
    <meta name="theme-color" content="#0e1420" />
    <!-- Installed-app chrome. iOS ignores the web manifest's display mode, so the
         apple-* pair is the only way a pinned SimpleRPG loses its browser bars;
         mobile-web-app-capable is the standard spelling of the same wish. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SimpleRPG" />
    <!-- 'black', not 'black-translucent'. Translucent extends the web view under
         the status bar, which is only safe if the layout pads with
         env(safe-area-inset-*) — and nothing in this codebase does. Combined
         with viewport-fit=cover it would put the sticky HUD under the Dynamic
         Island and the mobile tab bar under the home indicator on an installed
         iPhone. Opaque costs a strip of colour and breaks nothing. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- iOS ignores the web manifest's icons entirely and will not take an SVG,
         so the pinned tile comes from here or it comes out blank. Generated
         from favicon.svg by scripts/optimize-assets.mjs. -->
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/nine-slice.css" />
    <title>SimpleRPG</title>
    <style>
      /* Pre-hydration splash — keeps first paint on-theme */
      html {
        background: #0e1420;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d9a94b;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 20px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        animation: splash-pulse 1.2s ease-in-out infinite alternate;
      }
      @keyframes splash-pulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash">SimpleRPG</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
